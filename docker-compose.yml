version: '3.8'

services:
  db:
    image: postgres:14
    container_name: module4-task1
    restart: always
    environment:
      POSTGRES_DB: module4-task1
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
